services:
  postgres:
    image: postgres:17-alpine
    container_name: smartlift-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartlift}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - smartlift-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartlift"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: smartlift-backend
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartlift}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: ./frontend
    container_name: smartlift-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: smartlift-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - smartlift-prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: smartlift-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - smartlift-alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: smartlift-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - smartlift-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: smartlift-node-exporter

volumes:
  smartlift-postgres-data:
  smartlift-prometheus-data:
  smartlift-alertmanager-data:
  smartlift-grafana-data:
