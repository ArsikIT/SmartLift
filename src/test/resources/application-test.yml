spring:
  datasource:
    url: jdbc:tc:postgresql:16:///smartlift_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: integration-test-secret-key-that-is-at-least-32-chars
  expiration: 3600000
